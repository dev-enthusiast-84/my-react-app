server {
    # NGINX_PORT is filled in at container start by the image's envsubst step
    listen ${NGINX_PORT};
    listen [::]:${NGINX_PORT};
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Lightweight endpoint for the container health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA entry point: always revalidate so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build output (CRA puts it under /static/): safe to cache forever
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files without hashed names (favicon, logos, manifest): cache briefly
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?|json|txt)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
